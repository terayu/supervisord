<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ConfFile</title>
    <!--import the js libraries-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.2.6/ace.js" type="text/javascript"
            charset="utf-8"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.2.6/ext-language_tools.js" type="text/javascript"
            charset="utf-8"></script>
    <script src="js/axios.min.js"></script>
    <script src='js/jquery-3.3.1.min.js'></script>
    <script src="js/common.js"></script>
    <link rel="stylesheet" href="css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/bootstrap-table.css"/>
    <link rel="stylesheet" href="css/bootstrap-dialog.min.css"/>
</head>

<body>
<!--code input box (be sure to set a height, otherwise it is not displayed)-->
<pre id="code" class="ace_editor" style="min-height:600px">
 <textarea id="text_conf" class="ace_text-input">
</textarea>
</pre>
<button class="btn btn-primary">
    Save
</button>
<script>
    //initialize the object
    editor = ace.edit("code");

    //set the theme and the language (for more themes and languages, see the corresponding directories on github)
    theme = "crimson_editor"
    language = "java"
    editor.setTheme("ace/theme/" + theme);
    editor.session.setMode("ace/mode/" + language);

    //font size
    editor.setFontSize(18);

    //set read only (true means read only, for displaying code)
    editor.setReadOnly(false);

    //word wrap, set to off to disable
    editor.setOption("wrap", "free")

    $(document).ready(function () {
        console.log("hello world!")
        let name = getUrlVars()["name"]
        getConfFile(name)
    });

    function getConfFile(name) {
        if (name === undefined || name.length === 0){
            alert("need url variable name")
            return
        }
        axios.get("/conf/" + name).then(function (response) {
            console.log(response.data)
            editor.setValue(response.data)
        }).catch(function (err){
            alert("ERROR: no conf file is configured for this program, see conf_file to configure one")
        })

    }

</script>

</body>
</html>
