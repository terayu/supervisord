<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logs · Supervisor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="bootstrap-solid.svg">
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7; --surface: #fcfcfb; --surface-2: #f2f2ee;
  --line: #e2e1db; --line-2: #d3d2ca;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-muted: #898781;
  --accent: #2a78d6; --critical: #d03b3b; --critical-bg: #f9e8e8;
  --shadow: 0 1px 2px rgba(11,11,11,.05), 0 4px 12px rgba(11,11,11,.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --line: #2e2e2b; --line-2: #3d3d39;
    --ink: #fff; --ink-2: #c3c2b7; --ink-muted: #898781;
    --accent: #3987e5; --critical: #d03b3b; --critical-bg: #2a1414;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --line: #2e2e2b; --line-2: #3d3d39;
  --ink: #fff; --ink-2: #c3c2b7; --ink-muted: #898781;
  --accent: #3987e5; --critical: #d03b3b; --critical-bg: #2a1414;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 64px; }
.crumb { font-size: 13px; color: var(--ink-muted); margin-bottom: 6px; }
.crumb a { color: var(--accent); text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
h1 {
  font-size: 21px; font-weight: 620; letter-spacing: -.01em; margin: 0 0 22px;
  display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
}
h1 .prog {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 16px; font-weight: 500; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line);
  padding: 2px 9px; border-radius: 6px; word-break: break-all;
}
.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
}
ul { list-style: none; margin: 0; padding: 0; }
li { border-bottom: 1px solid var(--line); }
li:last-child { border-bottom: none; }
li a {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; text-decoration: none; color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13.5px; word-break: break-all;
}
li a:hover { background: var(--surface-2); }
li a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
li a svg { flex: none; color: var(--ink-muted); }
.state { padding: 48px 22px; text-align: center; color: var(--ink-muted); font-size: 14px; }
.state.bad { color: var(--critical); background: var(--critical-bg); }
.state .big { font-size: 15px; color: var(--ink-2); margin-bottom: 4px; }
.state.bad .big { color: var(--critical); }
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href=".">← All programs</a></div>
  <h1>Logs <span class="prog" id="prog"></span></h1>
  <div class="panel"><div id="app"><div class="state">Loading…</div></div></div>
</div>

<script>
"use strict";

function urlVar(key) {
  var q = window.location.search.substring(1).split("&");
  for (var i = 0; i < q.length; i++) {
    var kv = q[i].split("=");
    if (decodeURIComponent(kv[0]) === key) { return decodeURIComponent(kv[1] || ""); }
  }
  return undefined;
}

function state(cls, title, detail) {
  var box = document.createElement("div");
  box.className = "state" + (cls ? " " + cls : "");
  var b = document.createElement("div");
  b.className = "big";
  b.textContent = title;
  box.appendChild(b);
  if (detail) {
    var d = document.createElement("div");
    d.textContent = detail;
    box.appendChild(d);
  }
  var app = document.getElementById("app");
  app.textContent = "";
  app.appendChild(box);
}

function fileIcon() {
  var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("width", "14"); s.setAttribute("height", "14");
  s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("aria-hidden", "true");
  s.innerHTML = '<path d="M4 2h5l3 3v9H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 2v3h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>';
  return s;
}

function getLogDir(name) {
  if (name === undefined || name.length === 0) {
    state("bad", "Missing program name", "This page expects a ?name= parameter.");
    return;
  }
  // only allow a plain program name; anything else could redirect the request
  // to an unrelated same-origin endpoint
  if (!/^[A-Za-z0-9_.:-]+$/.test(name)) {
    state("bad", "Invalid program name", "Only letters, digits and _ . : - are accepted.");
    return;
  }
  document.getElementById("prog").textContent = name;

  var base = "/log/" + encodeURIComponent(name) + "/";
  fetch(base, { headers: { "Accept": "text/html" } }).then(function (r) {
    if (!r.ok) { throw new Error("HTTP " + r.status); }
    return r.text();
  }).then(function (body) {
    // DOMParser produces an inert document: scripts do not run and
    // resources (and therefore onerror handlers) are not loaded
    var doc = new DOMParser().parseFromString(body, "text/html");
    var anchors = doc.querySelectorAll("a");
    var list = document.createElement("ul");
    var count = 0;

    for (var i = 0; i < anchors.length; i++) {
      var href = anchors[i].getAttribute("href") || "";
      // the directory listing only ever links to a single path segment
      if (!/^[^/?#]+\/?$/.test(href)) { continue; }
      var li = document.createElement("li");
      var link = document.createElement("a");
      link.setAttribute("href", base + href);
      link.appendChild(fileIcon());
      var label = document.createElement("span");
      label.textContent = anchors[i].textContent;
      link.appendChild(label);
      li.appendChild(link);
      list.appendChild(li);
      count++;
    }

    if (!count) {
      state(null, "No log files", "The directory holding this program's log is empty.");
      return;
    }
    var app = document.getElementById("app");
    app.textContent = "";
    app.appendChild(list);
  }).catch(function (e) {
    state("bad", "No log configured for this program",
      "Set stdout_logfile in the [program:" + name + "] section, then reload. (" + e.message + ")");
  });
}

document.addEventListener("DOMContentLoaded", function () {
  getLogDir(urlVar("name"));
});
</script>
</body>
</html>
