<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LOG</title>
</head>
<body>
<script src="js/axios.min.js"></script>
<script src='js/jquery-3.3.1.min.js'></script>
<script src="js/common.js"></script>
<link rel="stylesheet" href="css/bootstrap.min.css"/>
<link rel="stylesheet" href="css/bootstrap-table.css"/>
<link rel="stylesheet" href="css/bootstrap-dialog.min.css"/>
<div id="app">

</div>

<script>
    $(document).ready(function () {
        var name = getUrlVars()["name"];
        getLogDir(name);
    });

    function getLogDir(name) {
        if (name === undefined || name.length === 0) {
            $("#app").text("need url variable name");
            return;
        }
        // only allow a plain program name; anything else could redirect the request
        // to an unrelated same-origin endpoint
        if (!/^[A-Za-z0-9_.:-]+$/.test(name)) {
            $("#app").text("invalid program name");
            return;
        }

        var base = "/log/" + encodeURIComponent(name) + "/";
        axios.get(base).then(function (response) {
            // DOMParser produces an inert document: scripts do not run and
            // resources (and therefore onerror handlers) are not loaded
            var doc = new DOMParser().parseFromString(response.data, "text/html");
            var list = document.createElement("ul");
            var anchors = doc.querySelectorAll("a");

            for (var i = 0; i < anchors.length; i++) {
                var href = anchors[i].getAttribute("href") || "";
                // the directory listing only ever links to a single path segment
                if (!/^[^/?#]+\/?$/.test(href)) {
                    continue;
                }
                var li = document.createElement("li");
                var link = document.createElement("a");
                link.setAttribute("href", base + href);
                link.className = "text-success font-weight-bold";
                link.style.fontSize = "20px";
                link.style.lineHeight = "30px";
                link.textContent = anchors[i].textContent;
                li.appendChild(link);
                list.appendChild(li);
            }

            $("#app").empty().append(list);
        }).catch(function (err) {
            $("#app").text("ERROR: no log is configured for this program, see stdout_logfile to configure one");
        });
    }


</script>
</body>
</html>
